# =============================================================================
# MEDIUM RUN  --  full dataset, moderate epoch budget
# =============================================================================
# A realistic "get a decent model overnight on a single GPU" setting. Inherits
# the full-dataset base; just a shorter, scheduled budget with early stopping.
#   python train.py --config configs/config_8x_medium.yaml
extends: config_8x.yaml

output_dir: results/8x_medium

train:
  epochs: 40
  val_every: 1
  save_every: 5
  scheduler:
    type: cosine
    warmup_epochs: 2
  early_stopping:
    enabled: true
    patience: 8
